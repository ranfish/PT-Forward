name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全历史（baseline 比对需要）
      - name: Install gitleaks (pinned 8.24.3)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secrets scan (baseline diff)
        run: |
          gitleaks git . --config .gitleaks.toml --report-format json --report-path /tmp/scan.json --exit-code 0
          python3 scripts/gitleaks-baseline-diff.py /tmp/scan.json .gitleaks-baseline.json

  build-and-push:
    needs: [secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set version
        id: version
        run: echo "VERSION=$(git describe --tags --always --dirty)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        continue-on-error: true
        id: dockerhub_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ranfish/pt-forward:latest
            ghcr.io/ranfish/pt-forward:${{ steps.version.outputs.VERSION }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            CACHEBUST=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/ranfish/pt-forward:latest
          cache-to: type=inline

      - name: Push to Docker Hub
        if: steps.dockerhub_login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pt-forward:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pt-forward:${{ steps.version.outputs.VERSION }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            CACHEBUST=${{ github.sha }}
          no-cache: true
