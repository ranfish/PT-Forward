name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc -b --noEmit

      - name: Lint
        run: npx eslint src/

      - name: Test
        run: npx vitest run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && echo '<html></html>' > frontend/dist/index.html

      - name: Download Go modules
        run: go mod download

      - name: Vet
        run: go vet ./internal/... ./cmd/pt-forward/...

      - name: Dict drift check
        run: |
          go run ./cmd/gen-dict
          git diff --exit-code web/src/generated/dict.ts || (echo "ERROR: dict.ts 与 dict/*.json 不同步，运行 go run ./cmd/gen-dict 并提交" && exit 1)

      - name: Test
        run: CGO_ENABLED=1 go test -short -count=1 -timeout 600s ./internal/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # --new-from-rev=HEAD~1 需要父提交

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && echo '<html></html>' > frontend/dist/index.html

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.6.2

      # §59.251 审核五轮定案：增量严检（--new-from-rev）——存量 108 条挂账清理轮逐步消化；
      # v1.64.5 时代 continue-on-error + 版本失配双重掩盖=lint 从未真跑（教训落盘 docs/31）
      - name: Lint（新增代码全量严检）
        run: $(go env GOPATH)/bin/golangci-lint run --timeout 5m --new-from-rev=HEAD~1 ./internal/...

  build:
    runs-on: ubuntu-latest
    needs: [frontend, test, lint]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Copy frontend dist
        run: rm -rf frontend/dist && cp -r web/dist frontend/dist

      - name: Build
        run: CGO_ENABLED=1 go build -ldflags "-s -w" -o pt-forward-ci ./cmd/pt-forward/

      # §59.463: ISA 防线（早期报警位）——CI 产物在 runner 直接构建，
      # runner glibc 滚动升级会抬高基线（v0.0.1186 案：runner 升级致
      # Release 资产 v3 化，pt4/33/35 NAS 老 CPU 全断 OTA）。此检查在
      # PR/push 阶段暴露漂移（不等发版）。注意：CI 产物不发布（Release
      # 走镜像提取链），本断言红=runner 环境变化预警。
      - name: CPU baseline guard (x86-64-baseline only)
        run: |
          ISA=$(readelf -n pt-forward-ci | grep -oP 'x86 ISA needed: \K.*' || true)
          echo "x86 ISA needed: ${ISA:-<无标记>}"
          if [ "${ISA}" != "x86-64-baseline" ]; then
            echo "::warning::CI runner 构建基线漂移: '${ISA}'（Release 走镜像链不受影响；此预警=runner 环境已变化 §59.463）"
          fi

